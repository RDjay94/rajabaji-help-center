<!doctype html>
<html lang="bn" data-lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rajabaji Help Center</title>
  <meta name="description" content="Step-by-step video tutorials for Rajabaji — register, deposit, withdraw, play, refer & earn. English & Bengali.">
  <link rel="icon" href="assets/img/app-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="bg-fx"></div>
  <div class="orb g"></div>
  <div class="orb b"></div>
  <div class="progress" id="progress"></div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="brand" id="brandBtn">
      <img src="assets/img/logo-horizontal.png" alt="Rajabaji" class="en-face">
      <span class="tag" id="brandTag">হেল্প সেন্টার</span>
    </div>
    <div class="spacer"></div>
    <div class="search" id="searchBox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="গাইড খুঁজুন…" autocomplete="off">
    </div>
    <a class="cta-btn cta-btn--play cta-btn--sm" id="navPlay" href="https://h5.rajabaji.net/referral?referral_code=" target="_blank" rel="noopener noreferrer" aria-label="Play Now"></a>
    <button class="icon-btn" id="musicBtn" title="Music">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    </button>
    <div class="lang-toggle" id="langToggle" data-lang="bn">
      <span class="thumb"></span>
      <button data-l="en">EN</button>
      <button data-l="bn" class="active">বাং</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="wrap">
      <div id="footerSocial" class="footer-social-wrap"></div>
      <div class="brand-row"><img src="assets/img/logo-horizontal.png" alt="Rajabaji" class="en-face"></div>
      <p id="footerNote">রাজাবাজি হেল্প সেন্টার</p>
    </div>
  </footer>

  <div class="social-rail" id="socialRail"></div>

  <button class="totop" id="toTop" title="Top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <audio id="ambient" src="assets/ambient.mp3" loop></audio>

  <script src="assets/js/content.js?v=8"></script>
  <script src="assets/js/app.js?v=8"></script>
</body>
</html>
